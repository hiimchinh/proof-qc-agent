name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: fixtures are reproducible
        run: go run ./cmd/genfixtures && git diff --exit-code testdata/
      - name: rules baseline runs offline
        run: go run ./cmd/proofqc eval -out /tmp/results
